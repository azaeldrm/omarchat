name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install jq, shellcheck, and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck bubblewrap

      - name: Allow bubblewrap's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        run: tests/run
